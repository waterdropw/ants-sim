[package]
name = "ants-sim"
version = "0.1.0"
edition = "2021"
description = "Ant individual + collective intelligence simulation"
license = "MIT"

[dependencies]
eframe = "0.36"
egui = "0.36"
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bytemuck = "1.14"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
