# Wehner & Muller (1988), Muller & Wehner (1988) Cataglyphis fortis
# path-integration homing error vs outbound distance.
metric = "cx_path_integration_drift"
source = "Wehner & Muller 1988; Muller & Wehner 1988 (Cataglyphis fortis)"
caveat = "Representative published values encoded as explicit datapoints from widely-cited summaries, NOT a per-colony copy of a copyrighted dataset. Cataglyphis PI homing error scales roughly linearly with distance (~5-15% drift, distance often underestimated); the model's leak-integrated ring attractor is MORE accurate (no sensory noise) — qualitative scaling match, not a quantitative fit. Model tick<->meters undefined; distances here are in model grid units for alignment with --bench-cx."
description = "PI homing distance drift (%) vs outbound walk distance. Model grid-unit distances {10,20,40,80} align with --bench-cx."

# drift % at increasing outbound distances (model grid units)
[[datapoints]]
x = 10.0
y = 8.0
y_lo = 5.0
y_hi = 15.0

[[datapoints]]
x = 20.0
y = 9.0
y_lo = 5.0
y_hi = 15.0

[[datapoints]]
x = 40.0
y = 10.0
y_lo = 5.0
y_hi = 15.0

[[datapoints]]
x = 80.0
y = 12.0
y_lo = 5.0
y_hi = 15.0
