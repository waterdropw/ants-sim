# Deneubourg & Goss (1989/1990) Argentine-ant double-bridge experiments;
# Camazine et al. (2001) "Self-Organization in Biological Systems" ch.13.
metric = "bridge_short_path_fraction"
source = "Deneubourg/Goss 1989/1990; Camazine et al. 2001 synthesis"
caveat = "Representative published values encoded as explicit datapoints from widely-cited summaries, NOT a per-colony copy of a copyrighted dataset. Colony sizes, species (Linepithema humile), bridge geometry and timing differ from the model; tick<->seconds is undefined. The model now measures actual inbound gate crossings, but this is still an abstract protocol rather than a statistical or species-level fit. Interval overlap is descriptive only."
description = "Fraction of traffic on the shorter bridge after convergence. The model comparator is the fraction of returning ants crossing the short-arm gate; it is not inferred from pheromone concentration."

# post-convergence short-bridge fraction across replicates
[[datapoints]]
y = 0.82
y_lo = 0.80
y_hi = 0.90

# initial ~50/50 split before pheromone feedback amplifies the short path
[[datapoints]]
y = 0.55
y_lo = 0.50
y_hi = 0.60
